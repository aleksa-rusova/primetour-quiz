<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Подобрать отдых — Прайм тур</title>
  <link rel="stylesheet" href="css/style.css?v=20261009a">
  <!-- SDK Telegram Mini Apps. В обычном браузере тоже подгружается: даёт пустой initData — значит режим «сайт». -->
  <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
  <!-- Локальная отладка: index.html?dev=1 подменяет Telegram.WebApp заглушкой (см. js/dev-shim.js) -->
  <script>
    if (/[?&]dev=1/.test(location.search)) {
      document.write('<script src="js/dev-shim.js"><\/script>');
    }
  </script>
  <script>
  /* Страховка от кэша Telegram.

     Реальный случай 25.08.2026: клиентка прошла квиз, заявка дошла до менеджера,
     а на экране у неё была ошибка. Причина — Telegram отдал сохранённый index.html
     недельной давности, и тот подтянул старый app.js без свежих исправлений.
     Версия в адресах скриптов от этого не спасает: она вшита в сам index.html,
     который и оказался старым.

     Поэтому спрашиваем актуальную версию отдельным файлом мимо кэша. Не совпала
     с вшитой — перезагружаемся с ней в адресе: другой адрес = другой ключ кэша,
     значит придёт свежая страница. Флаг в sessionStorage не даёт зациклиться,
     если version.json почему-то врёт. */
  (function () {
    // окно на сайте: класс ставим до отрисовки, чтобы не мигала тёмная тема (подробнее — IS_EMBED в app.js)
    if (window.parent !== window && /[?&]embed=1/.test(location.search)) document.documentElement.classList.add("is-embed");
    var BUILT = "20261009a";
    var GUARD = "primetour_reloaded_for";
    try {
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var fresh = data && data.v;
          if (!fresh || fresh === BUILT) return;
          if (sessionStorage.getItem(GUARD) === fresh) return;   // уже пробовали
          sessionStorage.setItem(GUARD, fresh);
          // остальные параметры (embed=1 окна на сайте, utm, campaign) не теряем
          var q = location.search.replace(/^\?/, "").split("&").filter(function (x) { return x && !/^v=/.test(x); });
          q.push("v=" + encodeURIComponent(fresh));
          location.replace(location.pathname + "?" + q.join("&"));
        })
        .catch(function () { /* нет сети — работаем тем, что есть */ });
    } catch (e) { /* совсем старый клиент — тоже не мешаем */ }
  }());
  </script>
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <noscript>Для квиза нужен JavaScript. Напишите нам напрямую: <a href="https://t.me/primetourpro">t.me/primetourpro</a></noscript>
  <!-- ?v= — чтобы Telegram не подсовывал старую версию из кэша: меняем при каждой правке.
       Тот же номер продублирован в version.json и в BUILT выше — все три меняются вместе. -->
  <script src="js/quiz-config.js?v=20261009a"></script>
  <script>
  /* Яндекс Метрика (09.10.2026). Счётчик и имена целей — в quiz-config.js (metrika),
     цели отправляет app.js через window.ym.

     1. Telegram кладёт в адрес после # подписанные данные пользователя (tgWebAppData:
        id, имя, username). SDK их уже прочитал, а в Метрику они попасть не должны —
        убираем хвост из адреса до загрузки счётчика. Перезагрузка из страховки
        версии и так открывает страницу без него, SDK берёт данные из sessionStorage.
     2. Локально (localhost, ?dev=1, ?demo=1) счётчик не грузим, чтобы не портить
        статистику: ym только пишет вызовы в консоль.
     3. В окне на сайте (?embed=1) просмотр страницы уже засчитала сама страница сайта,
        поэтому здесь defer: без второго просмотра, только цели и параметры. */
  (function () {
    var cfg = window.QUIZ_CONFIG && window.QUIZ_CONFIG.metrika;
    if (!cfg || !cfg.counterId) return;
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:" ||
      /[?&](dev|demo)=1/.test(location.search);
    try {
      if (/tgWebApp/.test(location.hash) && window.history && history.replaceState) {
        history.replaceState(history.state, "", location.pathname + location.search);
      }
    } catch (e) { /* не вышло — счётчик не грузим, данные Telegram дороже статистики */ if (/tgWebApp/.test(location.hash)) return; }
    if (local) {
      window.ym = function () { try { console.log.apply(console, ["[ym]"].concat([].slice.call(arguments))); } catch (e) {} };
      return;
    }
    (function (m, e, t, r, i, k, a) {
      m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
      m[i].l = 1 * new Date();
      k = e.createElement(t); a = e.getElementsByTagName(t)[0]; k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
    })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js?id=" + cfg.counterId, "ym");
    var embed = window.parent !== window && /[?&]embed=1/.test(location.search);
    window.ym(cfg.counterId, "init", {
      defer: embed, webvisor: false, clickmap: false, trackLinks: true, accurateTrackBounce: true,
      referrer: document.referrer, url: location.href,
    });
  }());
  </script>
  <script src="js/app.js?v=20261009a"></script>
</body>
</html>
